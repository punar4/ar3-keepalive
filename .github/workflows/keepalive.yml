name: Keep AR3 awake
on:
  schedule:
    - cron: "17 */4 * * *"   # Streamlit (Nebius demo), every 4 hours
    - cron: "*/10 * * * *"   # Render (PayPal demo), every 10 minutes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wake:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python wake.py
      - name: Keep this repo active (GitHub pauses schedules after 60 idle days)
        if: always()
        run: |
          date -u > last_run.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add last_run.txt
          git commit -m "keepalive" && git push || true

  render:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -o /dev/null -w "%{http_code}\n" --max-time 90 https://ar3-paypal.onrender.com/_stcore/health
